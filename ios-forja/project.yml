# XcodeGen spec → generates Forja.xcodeproj AND Info.plist from this file (ported from ios-bitacora).
#   regenerate:  bash ios-forja/setup-xcode.sh
# An `info:` block makes XcodeGen GENERATE the plist, overwriting whatever is there — so every key
# lives HERE. A hand-edited Info.plist is silently clobbered on the next regenerate.
name: Forja
options:
  bundleIdPrefix: com.leandro
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Forja:
    type: application
    platform: iOS
    sources:
      # Listed one by one ON PURPOSE: test-vault.swift carries its own @main.
      - path: ForjaApp.swift
      - path: ForgeView.swift
      - path: Speech.swift
      - path: Vault.swift
      - path: Assets.xcassets
      - path: Resources/app          # the derived web payload — built by build-forja.py
        type: folder
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: La Forja
        # Without a valid UILaunchScreen iOS letterboxes the app in black (learned in ios-bitacora).
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The debrief mic. Both prompts are shown once, the first time he taps Record.
        NSMicrophoneUsageDescription: La Forja listens while you record a debrief or check-in, so you can talk instead of type.
        NSSpeechRecognitionUsageDescription: Your spoken debrief is turned into text on this phone, so the coach can read how the session went.
        # The vault stays readable in Files.app even if signing lapses and the app won't launch.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leandro.forja
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        # The free personal team, declared HERE, not in Xcode's Signing tab — a team picked in the UI
        # is discarded on the next regenerate (see ios-bitacora/project.yml).
        DEVELOPMENT_TEAM: 4A7M5GBF3L
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Forja.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
