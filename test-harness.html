<!DOCTYPE html>
<!-- Cuaderno v4 deploy-gate harness: drives the Session Runner in an iframe; writes PASS/FAIL lines into #out.
     Run: python3 -m http.server → chrome --headless --virtual-time-budget=40000 --dump-dom http://localhost:PORT/test-harness.html
     exdb is tested WITHOUT network by pre-seeding localStorage['cuaderno.exdb.v3'] (keyed by the catalog's exact db names). -->
<html>
<head><meta charset="utf-8"></head>
<body>
<pre id="out"></pre>
<iframe id="f" src="about:blank" style="width:400px;height:800px"></iframe>
<script>
'use strict';
const out = [];
function log(name, ok, extra) { out.push(`HARNESS: ${ok ? 'PASS' : 'FAIL'} >> ${name}${extra ? ' >> ' + extra : ''}`); render(); }
function render() { document.getElementById('out').textContent = out.join('\n'); }
const f = document.getElementById('f');
const sleep = ms => new Promise(r => setTimeout(r, ms));
function W() { return f.contentWindow; }
function D() { return f.contentDocument; }
function q(sel) { return D().querySelector(sel); }
function state() { return JSON.parse(W().localStorage.getItem('cuaderno.v1')); }
function aw() { return state().activeWorkout; }
const GIF = 'data:image/gif;base64,R0lGODlhAQABAIAAAMLCwgAAACH5BAAAAAAALAAAAAABAAEAAAICRAEAOw==';
function seedExdb() {
  const map = {};
  for (const c of W().eval('CATALOG')) if (c.exdb) map[c.exdb] = { imgs: [GIF, GIF], instructions: ['Step one.', 'Step two.'] };
  W().localStorage.setItem('cuaderno.exdb.v3', JSON.stringify(map));
}
async function loadApp() {
  f.src = 'index.html';
  await new Promise(r => f.onload = r);
  await sleep(600);
}

(async () => {
  try {
    localStorage.clear();
    await loadApp();
    seedExdb();   // pre-seed exdb cache (no network in tests); takes effect on next render

    // ── boot ──
    log('boot: HOME renders START WORKOUT', !!q('[data-act="start-workout"]'));
    log('boot: week strip present', !!q('.week-strip'));
    log('boot: no plan card on fresh state', !q('.plan-card'));

    // ── runner: fresh start → brief (+auto picker) → LET'S GO → count → set ──
    q('[data-act="start-workout"]').click();                       // TAP 1
    await sleep(400);
    log('runner: brief mode on start', aw()?.mode === 'brief');
    const pick = q('#picker-list [data-act="pick-exercise"]');
    log('runner: picker auto-opens when session empty', !!pick);
    pick.click();
    await sleep(400);
    log('brief: exercise row listed', !!q('.brief-row'));
    log('brief: exdb thumb upgrades the row', !!q('.brief-row img.thumb'));
    log('brief: LET\'S GO present', !!q('[data-act="lets-go"]'));
    q('[data-act="lets-go"]').click();                             // TAP 2
    await sleep(300);
    log('count: 3-2-1 screen renders', aw().mode === 'count' && !!q('#count-num'));

    // reload mid-count → countStartedAt resumes/advances correctly
    await loadApp();
    log('count: mode survives reload', D().body.dataset.view === 'workout' && ['count', 'set'].includes(aw().mode));
    await sleep(4600); W().wkTick(); await sleep(200);             // let 3-2-1-GO elapse (manual tick: see plan-day note)
    log('count → set: auto-advanced', aw().mode === 'set' && !!q('.done-set-btn'));
    log('set: media animation (exdb) present', !!q('#media-flip'));
    log('set: ⓘ form steps available', !!q('[data-act="toggle-form"]'));
    log('set: SET 1/N progress shown', /Set 1 of/.test(q('.set-progress .sp')?.textContent || ''));
    log('set: weight input prefilled', (q('.player-body input[data-fld="w"]')?.value || '').length > 0);

    // reload mid-set → same screen, same cursor
    const cur0 = JSON.stringify(aw().cursor);
    await loadApp();
    log('set: mode+cursor survive reload', aw().mode === 'set' && JSON.stringify(aw().cursor) === cur0);

    // ── DONE SET → rest → skip → set 2 ──
    q('[data-act="done-set"]').click();                            // TAP 3 — first set logged
    await sleep(400);
    const st1 = state();
    log('3-tap prime directive: first set logged', st1.sessions[0]?.entries[0]?.sets.length === 1, JSON.stringify(st1.sessions[0]?.entries[0]?.sets[0] || null));
    log('rest: full-screen countdown', aw().mode === 'rest' && !!q('#rest-big'));
    log('rest: UP NEXT card', !!q('.upnext-card') && /Set 2 of/.test(q('.upnext-card .d')?.textContent || ''));
    q('[data-act="rest-skip"]').click();
    await sleep(300);
    log('rest SKIP → next set screen', aw().mode === 'set' && /Set 2 of/.test(q('.set-progress .sp')?.textContent || ''));

    // ── skip set → rest → skip → set 3 → DONE SET (last) → summary ──
    q('[data-act="skip-set"]').click();
    await sleep(300);
    log('skip set: row marked skipped, no log', aw().exercises[0].rows[1].skipped === true && state().sessions[0].entries[0].sets.length === 1);
    log('skip set → rest screen', aw().mode === 'rest');
    q('[data-act="rest-skip"]').click();
    await sleep(300);
    log('set 3 reached', /Set 3 of/.test(q('.set-progress .sp')?.textContent || ''));
    W().confirm = () => true;
    q('[data-act="done-set"]').click();                            // last undone row → finish
    await sleep(500);
    log('last set → summary', D().body.dataset.view === 'summary' && !!q('.sum-hero'));
    const st2 = state();
    log('finish: 2 logged sets (skipped excluded), endedAt set', st2.sessions[0].entries[0].sets.length === 2 && !!st2.sessions[0].endedAt && st2.activeWorkout === null);
    log('summary: debrief button offered', !!q('[data-act="debrief-session"]'));
    q('[data-act="goto-home"]').click();
    await sleep(300);
    log('home feed shows the workout', D().body.dataset.view === 'home' && !!q('[data-act="open-session"]'));
    log('home: streak strip shows n/goal', /\d+ of \d+/.test(q('.week-strip .l')?.textContent || ''), q('.week-strip .l')?.textContent);

    // ── debrief: home prompt → speak/type → saved on the session ──
    log('home: undebriefed session prompts 🎙', !!q('[data-act="debrief-session"]'));
    q('[data-act="debrief-session"]').click();
    await sleep(300);
    log('debrief modal opens', D().getElementById('debrief-modal').open);
    D().getElementById('db-text').value = 'Felt strong, slept 8h, slight left shoulder tweak on the last set.';
    D().getElementById('db-send').click();
    await sleep(400);
    const dbS = state().sessions.find(s => s.debrief);
    log('debrief saved to the session (no API key → stored anyway)', !!dbS && dbS.debrief.text.includes('shoulder'));
    log('home: debrief prompt cleared after saving', !q('[data-act="debrief-session"]'));

    // ── edit round-trip (new workout, resumed same day) ──
    q('[data-act="start-workout"]').click();
    await sleep(400);
    log('restart same day: brief again, done rows folded', aw().mode === 'brief' && aw().exercises[0].rows.filter(r => r.done).length === 2);
    q('[data-act="edit-session"]').click();
    await sleep(300);
    log('edit mode: table player renders', aw().mode === 'edit' && !!q('.ov-strip') && !!q('.player-nav'));
    q('[data-act="resume-runner"]').click();
    await sleep(300);
    log('resume runner from edit', ['set', 'edit'].includes(aw().mode), 'mode=' + aw().mode);   // 'edit' only if zero undone rows
    W().confirm = () => true;
    q('[data-act="cancel-workout"]').click();
    await sleep(300);
    log('cancel returns home (logged sets kept)', D().body.dataset.view === 'home' && state().sessions[0].entries[0].sets.length === 2);

    // ── coach chips ──
    W().nav('coach');
    await sleep(300);
    log('coach: full-screen overlay with inner scroller', !!q('.coach-wrap') && getComputedStyle(q('.coach-wrap')).position === 'fixed');
    log('coach: bottom tabs STAY visible (exit path)', getComputedStyle(q('#bottom-tabs')).display !== 'none');
    log('coach: chips render', D().querySelectorAll('#coach-chips [data-chip]').length === 5);
    log('coach: dock input present', !!q('#coach-dock #coach-text'));
    log('offline: prefetch fn + settings button wired', typeof W().offlinePrefetch === 'function' && !!D().getElementById('offline-prep-btn'));
    q('#coach-chips [data-chip="0"]').click();
    await sleep(200);
    log('coach: chip stuffs a real prompt (send blocked w/o key)', (q('#coach-text').value || '').toLowerCase().includes('program'));

    // ── coach gate: a REACHABLE Max-plan helper is sufficient on its own ──
    // The regression this exists for: isClaudeEnabled() ANDed in state.settings.claude.enabled,
    // which nothing but the Save-key button ever sets. On a device where no key had ever been
    // pasted the helper path was unreachable BY CONSTRUCTION, and the coach answered "add your API
    // key in settings first" with a live helper on 127.0.0.1. losReachable() is false at
    // localhost, so the sub path is stubbed in — and restored in the finally.
    const realReach = W().losReachable;
    const modeSel = D().getElementById('claude-mode');
    const setMode = m => { modeSel.value = m; modeSel.dispatchEvent(new (W().Event)('change')); };
    try {
      log('gate: helper unreachable (localhost) + no key → disabled', W().isClaudeEnabled() === false);
      W().losReachable = () => true;
      setMode('auto');
      log('gate: reachable helper ALONE enables the coach, no API key', W().isClaudeEnabled() === true);
      // RED CONTROL — re-plant the original gate at the same reads, under the same stub, and prove
      // it FAILS the assertion above. Without this, the line passes for any always-true expression.
      const planted = !!(state().settings.claude.enabled && (W().canUseApi() || W().canUseSub()));
      log('gate CONTROL: the old `enabled &&` gate reproduces the bug', planted === false, 'planted=' + planted);
      setMode('api');
      log('gate: Billing "API key only" + no key → still disabled', W().isClaudeEnabled() === false);
      setMode('sub');
      log('gate: Billing "Max plan only" + reachable → enabled', W().isClaudeEnabled() === true);
    } finally {
      W().losReachable = realReach;
      setMode('auto');
    }
    log('gate: losReachable restored → disabled again at localhost', W().isClaudeEnabled() === false);

    // ── plan lifecycle through the runner ──
    W().acceptPlan({ type: 'plan', name: 'TEST UL', days: [
      { name: 'UPPER', exercises: [{ name: 'Incline DB Press', gear: 'dumbbells', load: 'ext', sets: 2, reps: 5, startWeight: 50, videoQuery: 'incline' }] },
      { name: 'LOWER', exercises: [{ name: 'Goblet Squat', gear: 'dumbbells', load: 'ext', sets: 2, reps: 5, videoQuery: 'squat' }] },
    ]});
    await sleep(400);
    log('plan accepted: card on home', !!q('.plan-card'));
    q('[data-act="start-workout"]').click();
    await sleep(400);
    log('plan day: brief shows plan context', aw().mode === 'brief' && /Upper/.test(q('.brief-title')?.textContent || ''));
    q('[data-act="lets-go"]').click();
    await sleep(4800); W().wkTick(); await sleep(200);             // 3-2-1-GO (intervals don't fire in headless virtual time — drive the tick)
    log('plan day: set screen @ target weight', aw().mode === 'set' && q('.player-body input[data-fld="w"]')?.value === '50',
        `mode=${aw()?.mode} w=${q('.player-body input[data-fld="w"]')?.value}`);
    q('[data-act="done-set"]').click(); await sleep(300);
    q('[data-act="rest-skip"]')?.click(); await sleep(300);
    q('[data-act="done-set"]').click(); await sleep(500);
    log('plan day: finished via runner → summary', D().body.dataset.view === 'summary');
    log('plan cursor advanced', state().plan.cursor === 1, 'cursor=' + state().plan.cursor);
    q('[data-act="goto-home"]').click(); await sleep(300);

    // ── timed sets: plank with a hold countdown (+ schedule → NEXT line) ──
    W().acceptPlan({ type: 'plan', name: 'TEST TIMED', schedule: ['mon', 'tue', 'thu', 'fri'], days: [
      { name: 'CORE', exercises: [{ name: 'Plank', sets: 1, seconds: 45, videoQuery: 'plank' }] },
    ]});
    await sleep(400);
    log('timed: plan card shows 1×45s', /1 × 45s/.test(q('.plan-card')?.textContent || ''), JSON.stringify((q('.plan-card')?.textContent || '').slice(0, 120)));
    log('schedule: parsed to JS weekdays', JSON.stringify(state().plan.schedule) === '[1,2,4,5]', JSON.stringify(state().plan.schedule));
    log('schedule: home shows NEXT line', /Next: (today|tomorrow|Monday|Tuesday|Thursday|Friday), /.test(q('.plan-next')?.textContent || ''), q('.plan-next')?.textContent);
    q('[data-act="start-workout"]').click();
    await sleep(400);
    log('timed: brief row shows 45s target', /45s/.test(q('.brief-row .t')?.textContent || ''));
    q('[data-act="lets-go"]').click();
    await sleep(4800); W().wkTick(); await sleep(200);
    log('timed: set screen offers START HOLD', aw().mode === 'set' && !!q('[data-act="start-hold"]'), 'mode=' + aw()?.mode);
    log('timed: SEC input replaces reps', !!q('input[data-fld="s"]'));
    q('[data-act="start-hold"]').click();
    await sleep(300);
    log('timed: hold armed, countdown button live', !!aw().hold && !!q('[data-act="finish-hold"]'));
    await loadApp();   // mid-hold reload → countdown survives
    log('timed: hold survives reload', !!aw().hold && !!q('[data-act="finish-hold"]'));
    await sleep(1200);
    q('[data-act="finish-hold"]').click();   // end early → logs actual seconds held
    await sleep(500);
    const stT = state();
    const plankEx = stT.exercises.find(x => x.name === 'Plank');
    const plankEn = stT.sessions[0].entries.find(e => e.exerciseId === plankEx?.id);
    log('timed: hold logged as seconds (no reps, no NaN volume)',
        !!plankEn && plankEn.sets.length === 1 && plankEn.sets[0].sec >= 1 && plankEn.sets[0].r === undefined && Number.isFinite(W().sessionVol(stT.sessions[0])),
        JSON.stringify(plankEn?.sets[0] || null));
    log('timed: last set → summary', D().body.dataset.view === 'summary');
    q('[data-act="goto-home"]').click(); await sleep(300);

    // ── check-in: any-time "how do I feel" log from home ──
    log('checkin: home offers ♥ check-in', !!q('[data-act="log-checkin"]'));
    q('[data-act="log-checkin"]').click();
    await sleep(300);
    log('checkin: modal opens in check-in mode', D().getElementById('debrief-modal').open && D().getElementById('db-title').textContent === 'Check-in');
    log('checkin: mic language toggle present (en-US default)', !!q('#mic-lang-seg') && state().settings.micLang === 'en-US');
    D().getElementById('db-text').value = 'Left shoulder is sore from yesterday, everything else fine.';
    D().getElementById('db-send').click();
    await sleep(400);
    log('checkin: saved to state (no API key → stored anyway)', state().checkins?.length === 1 && state().checkins[0].text.includes('shoulder'));
    log('checkin: home daylog shows it', /check-in/.test(q('.daylog')?.textContent || ''), (q('.daylog')?.textContent || '').slice(0, 80));

    // ── other screens intact ──
    W().nav('history'); await sleep(300);
    log('history lists sessions', D().querySelectorAll('[data-act="open-session"]').length >= 1);
    W().nav('exercises'); await sleep(300);
    const exRow = q('[data-act="open-exercise"]');
    log('exercises screen lists movements (with thumbs)', !!exRow && !!q('img.thumb'));
    exRow.click(); await sleep(400);
    log('exercise detail: records + chart', !!q('.rec-grid') && !!q('#cv-e1rm'));

    // ── the gym: load types, per-gear units, one exercise per catalog entry ──
    W().acceptPlan({ type: 'plan', name: 'TEST GEAR', days: [{ name: 'MIX', exercises: [
      { name: 'Push-Up', sets: 1, reps: 10, startWeight: 45 },                                    // bw: a startWeight must be ignored
      { name: 'DB Row', gear: 'dumbbells', load: 'ext', sets: 1, reps: 10, startWeight: 30 },
    ]}]});
    await sleep(300);
    log('plan: "DB Row" shows as its common name', /Dumbbell Row/.test(q('.plan-card')?.textContent || '') && !/DB Row/.test(q('.plan-card')?.textContent || ''));
    log('plan: "DB Row" resolved to the ONE catalog exercise (no duplicate)', state().exercises.filter(e => e.cat === 'db-row').length === 1);
    q('[data-act="start-workout"]').click(); await sleep(400);
    q('[data-act="lets-go"]').click(); await sleep(4800); W().wkTick(); await sleep(200);
    log('bw: a push-up has NO weight input', aw().mode === 'set' && !q('.player-body input[data-fld="w"]') && !!q('.player-body .bw-cell'), 'mode=' + aw()?.mode);
    q('[data-act="done-set"]').click(); await sleep(300);
    const puId = state().exercises.find(e => e.cat === 'push-up').id;
    const puSet = state().sessions.flatMap(s => s.entries).find(e => e.exerciseId === puId)?.sets.slice(-1)[0];
    log('bw: logged push-up carries 0, not 45', puSet?.w === 0 && puSet?.r === 10, JSON.stringify(puSet));
    q('[data-act="rest-skip"]')?.click(); await sleep(300);
    log('ext: dumbbell row reads in LB with the plan\'s 30', /lb/.test(q('.player-body .unit-flip')?.textContent || '') && q('.player-body input[data-fld="w"]')?.value === '30',
        (q('.player-body .unit-flip')?.textContent || '') + ' / ' + q('.player-body input[data-fld="w"]')?.value);
    W().confirm = () => true;
    q('.player-body .unit-flip').click(); await sleep(300);
    log('unit flip: dumbbells now read KG, the pin number stays 30', /kg/.test(q('.player-body .unit-flip')?.textContent || '') && q('.player-body input[data-fld="w"]')?.value === '30',
        (q('.player-body .unit-flip')?.textContent || '') + ' / ' + q('.player-body input[data-fld="w"]')?.value);
    q('[data-act="done-set"]').click(); await sleep(500);
    const rowId = state().exercises.find(e => e.cat === 'db-row').id;
    const rowSet = state().sessions.flatMap(s => s.entries).find(e => e.exerciseId === rowId)?.sets.slice(-1)[0];
    log('unit flip: the set is stamped kg and stored as 30 kg in lbs', rowSet?.u === 'kg' && Math.abs(rowSet.w - 30 / 0.45359237) < 0.1, JSON.stringify(rowSet));
    log('unit flip: history reads it back as 30 kg', W().fmtSet(rowSet, W().eval('exById')(rowId)) === '30 × 10', W().fmtSet(rowSet, W().eval('exById')(rowId)));
    W().setGearUnit('dumbbells', 'lb');
    q('[data-act="goto-home"]')?.click(); await sleep(300);

    // ── gear gate lives in CODE: acceptPlan flags what the gym can't serve ──
    const warnP = { days: [{ exercises: [{ name: 'Barbell Squat' }, { name: 'Zercher Thing', gear: 'yoke' }, { name: 'Goblet Squat' }] }] };
    const w1 = W().planWarnings(warnP);
    log('gear: barbell + unknown gear flagged, dumbbell move not', w1.length === 2 && w1.some(x => /Barbell Squat/.test(x)) && w1.some(x => /yoke/.test(x)), JSON.stringify(w1));
    W().eval('state').gear.barbell = { have: true };                        // CONTROL: owning a barbell must clear that warning
    log('gear CONTROL: switching the barbell on clears its warning', W().planWarnings(warnP).length === 1);
    delete W().eval('state').gear.barbell;

    // ── demos: exact catalog lookup only; a custom exercise never borrows a lookalike picture ──
    log('demo: catalog exercise resolves its checked entry', !!W().exdbResolve({ cat: 'db-row' }));
    // an index IS loaded here, holding a lookalike — the old word-overlap matcher would hand the custom move this picture
    W().eval("EXDB_INDEX = [{ name: 'One-Arm Dumbbell Row', equipment: 'dumbbell', images: ['a/0.jpg', 'a/1.jpg'], instructions: [] }]");
    log('demo: custom exercise gets NO picture even with a lookalike in the db', W().exdbResolve({ id: 'zz', name: 'Dumbbell Row Variation Thing', load: 'ext' }) === null);
    W().eval('EXDB_INDEX = null');

    // ── coach reply parsing: Sonnet 5 / Opus 5 think by default, so content[0] is a thinking block ──
    const thinkingFirst = { stop_reason: 'end_turn', content: [{ type: 'thinking', thinking: '' }, { type: 'text', text: 'Solid session.' }] };
    log('reply: text found after a thinking block', W().claudeReplyText(thinkingFirst) === 'Solid session.');
    let threw = null;
    try { W().claudeReplyText({ stop_reason: 'max_tokens', content: [{ type: 'thinking', thinking: '' }] }); } catch (e) { threw = e.message; }
    log('reply: no text → throws naming stop_reason (never a success-looking placeholder)', /max_tokens/.test(threw || ''), threw);
    const oldRead = thinkingFirst.content?.[0]?.text || '(empty response)';   // RED CONTROL: the shipped read, same payload
    log('reply CONTROL: old content[0] read reproduces "(empty response)"', oldRead === '(empty response)');

    // ── mic: a recognizer failure must SAY so (it used to reset the button and leave the box blank) ──
    const realSR = W().SpeechRecognition, realWSR = W().webkitSpeechRecognition;
    const fakeSR = mode => class { start() { setTimeout(() => { if (mode !== 'silent') this.onerror?.({ error: mode }); this.onend?.(); }, 10); } stop() { this.onend?.(); } };
    try {
      W().SpeechRecognition = fakeSR('not-allowed');
      W().openCheckin(); await sleep(100);
      D().getElementById('db-mic').click(); await sleep(200);
      const st = D().getElementById('db-mic-status');
      log('mic: blocked permission is reported, not swallowed', !st.hidden && /blocked/.test(st.textContent), st.textContent);
      log('mic: button resets after the failure', /record/i.test(D().getElementById('db-mic').textContent));
      W().SpeechRecognition = fakeSR('silent');
      W().openCheckin(); await sleep(100);                       // the modal binds the recognizer class when it opens
      D().getElementById('db-mic').click(); await sleep(200);
      log('mic: a session that hears nothing says so', !st.hidden && /isn't hearing/.test(st.textContent), st.textContent);
    } finally {
      W().SpeechRecognition = realSR; W().webkitSpeechRecognition = realWSR;
      D().getElementById('debrief-modal').close();
    }

    // ── schema 2 migration on a LEGACY state: merge dupes, zero the fake 45s, keep real loads ──
    const legacy = {
      settings: { units: 'lbs', claude: { equipment: 'Dumbbells, pulley machine; no barbell' } },
      exercises: [{ id: 'a', name: 'Push-Up' }, { id: 'b', name: 'DB Row' }, { id: 'c', name: 'Dumbbell Row' },
                  { id: 'd', name: 'Weird Custom' }, { id: 'e', name: 'Weighted Pull-Up' }],
      sessions: [{ id: 's1', date: '2026-09-10', endedAt: 9, entries: [
        { exerciseId: 'a', sets: [{ w: 45, r: 10, ts: 1 }, { w: 45, r: 12, ts: 2 }] },
        { exerciseId: 'b', sets: [{ w: 15, r: 10, ts: 3 }] },
        { exerciseId: 'c', sets: [{ w: 20, r: 10, ts: 4 }] },
        { exerciseId: 'd', sets: [{ w: 45, r: 5, ts: 5 }] },
        { exerciseId: 'e', sets: [{ w: 45, r: 5, ts: 6 }, { w: 25, r: 6, ts: 7 }] },
      ], debrief: { text: 'ok', reply: '(empty response)' } }],
      bodyweight: [], cardio: [], activeWorkout: null, lastModified: 1,
      plan: { name: 'P', cursor: 0, days: [{ id: 'd1', name: 'D', exercises: [
        { exerciseId: 'b', name: 'DB Row', sets: 3, reps: 10, w: 15 }, { exerciseId: 'a', name: 'Push-Up', sets: 3, reps: 10, w: 45 }] }] },
    };
    W().localStorage.setItem('cuaderno.v1', JSON.stringify(legacy));
    await loadApp();
    const m = state(), ents = m.sessions[0].entries, eid = n => m.exercises.find(x => x.name === n)?.id;
    log('migrate: "DB Row" + "Dumbbell Row" → one exercise', m.exercises.filter(x => x.cat === 'db-row').length === 1 && !m.exercises.some(x => x.name === 'DB Row'));
    log('migrate: their sets merged into one entry, none lost', ents.find(x => x.exerciseId === eid('Dumbbell Row'))?.sets.length === 2 && ents.reduce((n, x) => n + x.sets.length, 0) === 7);
    log('migrate: the fake 45 on push-ups → 0', ents.find(x => x.exerciseId === eid('Push-Up')).sets.every(s => s.w === 0));
    log('migrate CONTROL: a bw+ 45 (pull-up) and a custom 45 are REAL and kept',
        ents.find(x => x.exerciseId === eid('Pull-Up'))?.sets.map(s => s.w).join() === '45,25' && ents.find(x => x.exerciseId === eid('Weird Custom'))?.sets[0].w === 45);
    log('migrate: every set stamped u', ents.every(x => x.sets.every(s => s.u === 'lb')));
    log('migrate: plan points at the survivor, bw target has no weight', m.plan.days[0].exercises[0].exerciseId === eid('Dumbbell Row') && m.plan.days[0].exercises[1].w === null);
    log('migrate: "(empty response)" is not kept as a reply', m.sessions[0].debrief.reply === null);
    log('migrate: old-gym equipment text is parked, not fed to Coach', m.settings.claude.equipment === '' && /pulley/.test(m.settings.claude.equipmentOld));
    log('migrate: pre-migration snapshot kept on the device', !!W().localStorage.getItem('cuaderno.v1.pre-schema2'));
    const again = W().schemaMigrate(JSON.parse(JSON.stringify(m)));
    log('migrate: idempotent (a second run changes nothing)', JSON.stringify(again) === JSON.stringify(m));
    // an OLD build still on another device pushes a u-less 45-lb push-up: the next load must clean it
    const pushedByOld = JSON.parse(JSON.stringify(m));
    pushedByOld.sessions[0].entries.find(x => x.exerciseId === eid('Push-Up')).sets.push({ w: 45, r: 8, ts: 99 });
    const cleaned = W().schemaMigrate(pushedByOld);
    const lastPu = cleaned.sessions[0].entries.find(x => x.exerciseId === eid('Push-Up')).sets.slice(-1)[0];
    log('migrate: an old build\'s u-less 45 push-up is cleaned on the next pull', lastPu.w === 0 && lastPu.u === 'lb', JSON.stringify(lastPu));

    log('ALL DONE', true);
  } catch (e) {
    log('EXCEPTION', false, e.message + ' @ ' + (e.stack || '').split('\n')[1]);
  }
})();
</script>
